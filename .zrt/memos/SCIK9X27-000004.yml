info:
    id: SCIK9X27-000004
    path: docs/ツールの動作イメージ.md
sentences:
    - id: SCIK9X27-000004-000000
      hash: f01e80e70098f6c6ac454228db82a483e5843d7bea64ec3564f0b409f4244562
      sentence: タスク生成ツールに、業務を規定するプロンプトと、ターゲットリストを与える。なお、ターゲットリストは改行区切りで複数のエントリを記述する。
    - id: SCIK9X27-000004-000001
      hash: 15b7028734d4d6f22405e2e63be322f6a598be1fe0250959882a3f6e2f955da4
      sentence: 例えば、URLが記載されたターゲットリストを与えて、「URLリストのURLに一つずつアクセスして、ページの要約をresults/ディレクトリにマークダウン形式でファイル出力しなさい」という業務プロンプトを入力する。
    - id: SCIK9X27-000004-000002
      hash: 0ac4f8b469688557a5cba93e47b88f107dbcabebbe4fc30c8fa80703920be950
      sentence: タスク生成ツールは、ターゲットリストのURLごとにタスクプロンプトを書き出す。例えば、URLリストには、urlA、urlB、urlCが列挙されているとする。タスクプロンプトは、業務プロンプトとひとつのURLを組み合わせて以下のようにする。
    - id: SCIK9X27-000004-000003
      hash: add77a8aa58144b500e651f0320873ea2848da93ddf278ed9f13a6a02f2aaaae
      sentence: |-
        ```text
        あなたは、有能なビジネスマンです。上司から、「ターゲットリストのURLに一つずつアクセスして、ページの要約をresults/ディレクトリにマークダウン形式でファイル出力しなさい」というミッションを与えられました。一緒に与えられたリストを複数のビジネスマンが分担して取り組みます。あなたが割り当てられたのは、urlAです。上司からの指示に従ってミッションを実行してください。
        ```
    - id: SCIK9X27-000004-000004
      hash: c58b8670e941b5c815f97870bc23e63ee8a923bedd0e02f0ea15e0c361e50e4d
      sentence: タスク生成ツールは、ターゲットリストの各行ごとに上記のようなプロンプトを生成し、.tasks/pending/ディレクトリにテキストファイルとして書き出す。
    - id: SCIK9X27-000004-000005
      hash: d4b5269f6881ab08af5f434a4fc4e4484fe6bd164b4a70efc5cff915874f0ca9
      sentence: タスク生成ツールの動作が完了したあとは、操作者がタスク管理マスタを起動する。さらに、別ターミナルでタスクワーカーを起動する。
    - id: SCIK9X27-000004-000006
      hash: f4f84abe677ae8f907da884c58d6ed214f2c6cdca6d7cd1f3bee914c931cc307
      sentence: タスク管理マスタは、タスクワーカーに対して、.tasks/pending/の下にあるタスクプロンプトファイルを一つ指定して実行を依頼する。
    - id: SCIK9X27-000004-000007
      hash: a4562dcdd98fa81929793d9a67a56ae918b3e442c5adc38d0aa87aced4b9c06f
      sentence: タスクワーカーは、タスクマスタからの依頼を受けて、タスクを実行する。
    - id: SCIK9X27-000004-000008
      hash: ba868c4bd594c2338503bdace3d6ad2a2e287d1ce163a45e1c5929b5ec639adf
      sentence: タスクの実行が完了または失敗したら、タスク管理マスターに報告し、次の依頼を待つ。
    - id: SCIK9X27-000004-000009
      hash: fc382f94127b8c69fae052301162de429c4346b84919c28ba554a8000c565502
      sentence: タスク管理マスタは、.tasks/pending/のファイルがなくなるまで、ワーカーにタスクを依頼する。
    - id: SCIK9X27-000004-00000A
      hash: e8cf1de030c0e73a41540e8d7f9424767e1d9d72274489a14972709a08dd0429
      sentence: 全てのタスクプロンプトファイルが.tasks/pendingからなくなったら、タスク管理マスタはワーカーに終了通知を送り、自らも終了する。
    - id: SCIK9X27-000004-00000B
      hash: 2d6836fdf76f55c0f965b29a6e7408a9a301d20dff3b523612b2db98cf222b78
      sentence: ワーカーは、終了通知を受け取ると、依頼待受を解除して、自らも終了する。
