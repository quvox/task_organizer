      sentence: 与えた業務を、並行実行可能なタスクに分割して、タスクをAIエージェントに実行させたい。
    - id: SCIK9X27-000007-000001
      hash: e03112f6e5465f6f424f3acec2715a6fff9b0f2b4e9d699f01b1fb908036feba
      sentence: その目的は、AIエージェントのコンテキストをタスクごとにリセットすることで、コストを圧縮することと、別のAIエージェントにもタスクを実行できるようにして、業務完了までの時間を圧縮することである。
    - id: SCIK9X27-000007-000002
