info:
    id: SCIK9X27-000002
    path: docs/タスク生成.md
sentences:
    - id: SCIK9X27-000002-000000
      hash: 8c287ac698e7ff2929708134ae4654ae0624f6485723f13040ecb8e289e62152
      sentence: タスク生成ツールは、`taskorganizer create`で起動する。
    - id: SCIK9X27-000002-000001
      hash: f42e134c55aa7342ecdd760cea4d2f571b0faf7fa65a16b1a7c58e029c603793
      sentence: タスク生成ツールには、2つのテキストファイルパスを引数で与える。一つは業務プロンプトテキスト、もう一つはターゲットリストである。
    - id: SCIK9X27-000002-000002
      hash: 95faadd851819b876dc08593d65300b88608fbc9a2e713b1455a562300050a9d
      sentence: タスク生成ツールには、さらにオプショナル引数でルートディレクトリパスを指定する。なお、デフォルトのルートディレクトリはスクリプトを実行した時のカレントディレクトリとする。
    - id: SCIK9X27-000002-000003
      hash: 1c999b52057407d1b166bfc8cb35805a2ffe08d313145942d8c67fdf59e20dfb
      sentence: オプショナルの引数"--clear"を指定した場合、ルートディレクトリにすでに存在している.tasks/ディレクトリを起動時に全て削除する。
    - id: SCIK9X27-000002-000004
      hash: b4cbb0cae8fa6337105c92579896eeceb70fba18ea8190031187f2d0d12ed8a3
      sentence: 業務プロンプトには、実行させたい業務がテキストで記述されている。
    - id: SCIK9X27-000002-000005
      hash: 2532561c08562ea061ff1fb51108f26e885e18e18bc89d41a69a3122ab6159ab
      sentence: ターゲットリストには、業務対象のリストが改行区切りのテキストで記述されている。
    - id: SCIK9X27-000002-000006
      hash: e6ec881daac81e0c522970bc85e353d4b7e74159d34f84b4e25c80332994f29b
      sentence: タスク生成ツールを起動すると、ルートディレクトリの下に、.tasks/ディレクトリを生成し、さらにその下に、pending、working、done、failedというサブディレクトリを作る。
    - id: SCIK9X27-000002-000007
      hash: 52c8a887d85647cb70c51fcc1bcc81a8f95eca611d77c3e1d5a12ad99e0750c5
      sentence: タスク生成ツールは、ターゲットリスト1行1行に対して、タスクプロンプトを生成し、.tasks/pending/の下にテキストファイルとして出力する。
    - id: SCIK9X27-000002-000008
      hash: 62c7a3ae93692cb0afd15296eab189813d4901688395eee4d46020b4a9caf18a
      sentence: タスクプロンプトには、以下のテキストを書き出す。＜業務プロンプトの内容＞の部分には、ツールに業務プロンプトテキストを、＜ターゲットリストのエントリ＞の部分には、リストから読み取った1行を書く。
    - id: SCIK9X27-000002-000009
      hash: f4c64664d1dd0faae17363d74896b24e42cf84b0b953e529607e1b322ca3ab88
      sentence: |-
        ```text
        あなたは、有能なビジネスマンです。上司から、「＜業務プロンプトの内容＞」というミッションを与えられました。一緒に与えられたリストを複数のビジネスマンが分担して取り組みます。あなたが割り当てられたのは、＜ターゲットリストのエントリ＞です。上司からの指示に従ってミッションを実行してください。
        ```
