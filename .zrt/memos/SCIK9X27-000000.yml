    - id: SCIK9X27-000000-00000F
      hash: f99c70161745ec5572911234494e59380214428c1c2c985a0a9727b4df22ab70
      sentence: |-
        ```go
        // エラー時は新しいセッションを作成
        if strings.Contains(err.Error(), "session") {
            newSessionID, err := w.createClaudeSession()
            if err == nil {
                w.sessionID = newSessionID
                // タスクを再実行
            }
        }
        ```
    - id: SCIK9X27-000000-000010
