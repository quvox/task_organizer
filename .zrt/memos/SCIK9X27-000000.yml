    - id: SCIK9X27-000000-000006
      hash: 19c1569a97eb2b920801caa2bd348bc9053e2766396a288042830197d0d49661
      sentence: |-
        ```go
        // 初期化時にセッションIDを取得
        func (w *TaskWorker) createClaudeSession() (string, error) {
            var cmdArgs []string
            if w.config.Opus {
                cmdArgs = []string{"claude", "--output-format", "json", "--model", "opus", "-p", "."}
            } else {
                cmdArgs = []string{"claude", "--output-format", "json", "--model", "sonnet", "-p", "."}
            }
            cmd := exec.CommandContext(w.ctx, cmdArgs[0], cmdArgs[1:]...)
            output, err := cmd.Output()
            if err != nil {
                return "", fmt.Errorf("Claude CLI failed: %w", err)
            }
            // JSONレスポンスからセッションIDを抽出
            var response struct {
                SessionID string `json:"session_id"`
                IsError   bool   `json:"is_error"`
            }
            if err := json.Unmarshal(output, &response); err != nil {
                return "", fmt.Errorf("failed to parse Claude response: %w", err)
            }
            return response.SessionID, nil
        }
        ```
    - id: SCIK9X27-000000-000007
      hash: 806aeefa54ed5787d4142b8c1aaf8664d2f940a5e0a7dece88cca1e9e70785e9
      sentence: "```go\n// 取得したセッションIDでタスクを実行\nfunc (w *TaskWorker) executeTask(promptText string) {\n    cmdArgs := []string{\n        \"claude\", \"--output-format\", \"json\", \n        \"-r\", w.sessionID,  // セッションIDを指定\n        \"--allowedTools\", \"WebFetch,Read,Write,Bash\", \n        \"--model\", \"sonnet\", \n        \"-p\", promptText,\n    }\n    // ... 実行処理\n}\n```"
    - id: SCIK9X27-000000-000008
      hash: 7a7904ff5a29dca6494e984a005c8fc3c60364d05244a781495f3ea63eb48f70
      sentence: '1. **コンテキスト継続**: 同一セッション内で前の会話を覚えている'
    - id: SCIK9X27-000000-000009
      hash: bd05b6b27da2cbd1e9b18a57529302cb599dbe043a23a9de395479b1fbf6c8c6
      sentence: '2. **効率性**: セッション初期化のオーバーヘッドを削減'
    - id: SCIK9X27-000000-00000A
      hash: 9d69c8d7badf7fc2291cfbfe1a871f989ccb5844b498046466c25cd0619a3af9
      sentence: '3. **一貫性**: 複数のタスク間で一貫した応答を得られる'
    - id: SCIK9X27-000000-00000B
      hash: 37d9d36c9973308016c9b4829c579b7dcfe6dfafdd5b284d0c23449b07aea84e
      sentence: '1. **セッション有効期限**: Claudeセッションには有効期限があるため、長時間の運用では再作成が必要'
    - id: SCIK9X27-000000-00000C
      hash: 6069b34bf86fc8a5a885130954de41a89f380a0f5ce9534622fc5aec53a4ed0c
      sentence: '2. **エラーハンドリング**: セッションが無効になった場合の処理を実装する必要がある'
    - id: SCIK9X27-000000-00000D
      hash: b149b3fe79a42221c5cd95caf260656a16a4dd638d53060547375ce08ffa4b89
      sentence: '3. **並行実行**: 複数ワーカーでは個別のセッションIDが必要'
    - id: SCIK9X27-000000-00000E
      hash: f63b21586b55b91213d7695d24f5bfeddf01d434ad4f8cb71ecf932fd573c3c4
      sentence: |-
